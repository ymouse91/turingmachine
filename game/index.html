<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2efe7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turing-peli">
    <title>Turing-peli</title>
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="setup-screen" id="setup-screen" aria-labelledby="setup-title">
        <div class="setup-card">
          <div class="brand-row">
            <img src="../icon.svg" alt="" class="brand-mark">
            <div>
              <p class="eyebrow">Turing Machine</p>
              <h1 id="setup-title">Peli</h1>
            </div>
          </div>

          <form id="setup-form" class="setup-form">
            <fieldset>
              <legend>Pelaajat</legend>
              <div class="segmented player-count" role="radiogroup" aria-label="Pelaajien määrä">
                <label><input type="radio" name="players" value="1" checked><span>1</span></label>
                <label><input type="radio" name="players" value="2"><span>2</span></label>
                <label><input type="radio" name="players" value="3"><span>3</span></label>
                <label><input type="radio" name="players" value="4"><span>4</span></label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Vaikeustaso</legend>
              <div class="segmented" role="radiogroup" aria-label="Vaikeustaso">
                <label><input type="radio" name="difficulty" value="EASY"><span>Helppo</span></label>
                <label><input type="radio" name="difficulty" value="STANDARD" checked><span>Normaali</span></label>
                <label><input type="radio" name="difficulty" value="HARD"><span>Vaikea</span></label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Tarkistimet</legend>
              <div class="segmented" role="radiogroup" aria-label="Tarkistimien määrä">
                <label><input type="radio" name="verifiers" value="4" checked><span>4</span></label>
                <label><input type="radio" name="verifiers" value="5"><span>5</span></label>
                <label><input type="radio" name="verifiers" value="6"><span>6</span></label>
              </div>
            </fieldset>

            <button class="primary-button" type="submit">Aloita peli</button>
          </form>
        </div>
      </section>

      <section class="board-screen" id="board-screen" hidden>
        <aside class="score-panel">
          <div class="brand-row compact">
            <img src="../icon.svg" alt="" class="brand-mark">
            <div>
              <p class="eyebrow">Turing-peli</p>
              <h2 id="round-title">Kierros 1</h2>
            </div>
          </div>
          <div class="players" id="players"></div>
          <button class="ghost-button" id="new-game" type="button">Uusi peli</button>
        </aside>

        <section class="challenge-area" aria-labelledby="challenge-title">
          <div class="challenge-top">
            <div>
              <p class="eyebrow">Haaste</p>
              <h2 id="challenge-title">Valmis</h2>
            </div>
            <div class="symbol-badge" id="symbol-badge">#</div>
          </div>
          <div class="verifier-grid" id="verifier-grid"></div>
        </section>

        <section class="turn-panel" aria-labelledby="turn-title">
          <div class="turn-top">
            <div>
              <p class="eyebrow">Vuoro</p>
              <h2 id="turn-title">Pelaaja 1</h2>
            </div>
            <button class="secondary-button" id="pass-turn" type="button">Vaihda</button>
          </div>

          <div class="code-picker" aria-label="Testattava koodi">
            <label class="code-slot blue">
              <select id="blue-digit" aria-label="Sininen numero"></select>
            </label>
            <label class="code-slot yellow">
              <select id="yellow-digit" aria-label="Keltainen numero"></select>
            </label>
            <label class="code-slot purple">
              <select id="purple-digit" aria-label="Violetti numero"></select>
            </label>
          </div>

          <div class="test-row">
            <select id="verifier-select" aria-label="Valitse tarkistin"></select>
            <button class="primary-button" id="run-test" type="button">Testaa</button>
          </div>

          <div class="result-box" id="result-box">Valitse koodi ja tarkistin.</div>

          <div class="solve-box">
            <p class="eyebrow">Ratkaisuveikkaus</p>
            <div class="guess-row">
              <button class="secondary-button guess-button" data-guess="current" type="button">Arvaa valittu koodi</button>
              <button class="ghost-button" id="reveal-game" type="button">Paljasta itselle</button>
            </div>
          </div>

          <div class="notes">
            <label for="player-notes">Omat muistiinpanot</label>
            <textarea id="player-notes" spellcheck="false"></textarea>
          </div>

          <div class="log-panel">
            <p class="eyebrow">Oma loki</p>
            <ol id="player-log"></ol>
          </div>
        </section>
      </section>
    </main>

    <dialog id="turn-dialog" class="turn-dialog">
      <form method="dialog">
        <p class="eyebrow">Vuoron vaihto</p>
        <h2 id="dialog-title">Pelaaja 1</h2>
        <p id="dialog-copy">Anna iPad seuraavalle pelaajalle.</p>
        <button class="primary-button" value="ready">Aloita vuoro</button>
      </form>
    </dialog>

    <dialog id="end-dialog" class="turn-dialog">
      <form method="dialog">
        <p class="eyebrow">Peli päättyi</p>
        <h2 id="end-title">Ratkaistu</h2>
        <p id="end-copy"></p>
        <button class="primary-button" value="ok">Sulje</button>
      </form>
    </dialog>

    <script src="../app.js?v=16"></script>
    <script src="game.js" type="module"></script>
  </body>
</html>
